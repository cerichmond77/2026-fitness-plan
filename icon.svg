<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="96" fill="#2F4F3E"/>
  <!-- Stopwatch body -->
  <circle cx="256" cy="296" r="148" fill="#FAF6EE"/>
  <circle cx="256" cy="296" r="148" fill="none" stroke="#2F4F3E" stroke-width="14"/>
  <!-- Stem -->
  <rect x="232" y="92" width="48" height="44" rx="10" fill="#FAF6EE"/>
  <rect x="216" y="76" width="80" height="20" rx="8" fill="#FAF6EE"/>
  <!-- Side button -->
  <rect x="392" y="172" width="22" height="38" rx="6" fill="#FAF6EE" transform="rotate(45 403 191)"/>
  <!-- Tick marks -->
  <g stroke="#2F4F3E" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="164" x2="256" y2="184"/>
    <line x1="256" y1="408" x2="256" y2="428"/>
    <line x1="124" y1="296" x2="144" y2="296"/>
    <line x1="368" y1="296" x2="388" y2="296"/>
  </g>
  <!-- Minute hand (terracotta) -->
  <line x1="256" y1="296" x2="256" y2="180" stroke="#C56C40" stroke-width="14" stroke-linecap="round"/>
  <!-- Second hand (smaller) -->
  <line x1="256" y1="296" x2="340" y2="252" stroke="#2F4F3E" stroke-width="8" stroke-linecap="round"/>
  <!-- Center pivot -->
  <circle cx="256" cy="296" r="14" fill="#2F4F3E"/>
</svg>
